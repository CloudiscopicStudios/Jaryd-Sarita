[build]
  # Only install deps — Netlify functions are bundled separately by esbuild.
  # The React frontend is served by GitHub Pages, not Netlify.
  command = "npm ci"
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Route /api/* requests to the serverless functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true
